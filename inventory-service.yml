quickmart:
  security:
    internal:
      order-service-key: ${ORDER_INVENTORY_SERVICE_KEY}
      store-service-key: ${INVENTORY_STORE_SERVICE_KEY}
server:
  port: 8088

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:mysql://localhost:3306/inventory_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
  secret: mysupersecretkeywhichislongenough

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized

inventory:
  kafka:
    outbox-topic: quickmart.inventory.events

  outbox:
    poll-interval-ms: 1000
