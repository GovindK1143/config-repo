server:
  port: 8087

spring:
  application:
    name: store-service

  datasource:
    url: jdbc:mysql://localhost:3306/store_db
    username: root
    password: ${QUICKMART_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

jwt:
  secret: ${QUICKMART_JWT_SECRET}

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized
